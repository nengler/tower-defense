name: Pages

# Builds the game as a web page (`tse package --engine web`) and publishes it to GitHub Pages on every push to main, so a phone
# can play it at the repository's Pages address. Turn it on once in Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci
      - run: npm run package:web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/tower-defense-web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
