name: CI

# One job: install the engine's packs from their release (package.json) and run `rge check`: compile, type-check, tests, and the
# parity run under Node and the Rust host. The packs' native binaries are linux-x64, built for glibc 2.38 and newer, so this pins
# ubuntu-24.04.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci
      - run: npm run check
